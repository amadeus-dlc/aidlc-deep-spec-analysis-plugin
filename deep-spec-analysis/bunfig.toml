# テスト設定 — domain 層と共通基盤の 90% カバレッジ床（DDD 移行の品質ゲート、issue #14）。
#
# 計測対象は src/ の domain 層と kernel/infrastructure。センサー CLI（src/entries/）・
# scripts・テスト補助はカバレッジ計測から除外する（CLI は子プロセス実行で
# in-process 計測に乗らず、golden/e2e スイートが実効カバレッジを担う）。
# 生成物 tools/ は除外を書く必要がない——実測でも計測に一切現れない
# （全て子プロセス実行のため in-process 計測に乗らない）。
# 通常の `bun test --coverage` は、ファイル単位の関数・行カバレッジが
# 閾値を下回ると異常終了する。scripts/coverage.tsはLCOVのLF/LHを合算し、
# 行カバレッジの絶対・相対ゲートを別に判定する。

[install]
# 層パッケージ間の依存は宣言したものだけを解決可能にする（pnpm 形式の
# 分離レイアウト）。未宣言の @deep-spec-analysis/* は import 時点で解決に失敗する。
linker = "isolated"

[test]
coverageThreshold = 0.9
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "tests/**",
  "scripts/**",
  "src/entries/aidlc-sensor-*.ts",
  "src/entries/deep-spec-analysis-doctor.ts",
  "src/entries/data/**",
  # 数値ゲートの憲章は「domain 層に 90%」。adapter/usecase は契約テストで
  # 検証するが、per-file 閾値の対象には含めない（I/O 分岐の網羅は spawn 系
  # スイートと sandbox が担う）。
  "src/kernel/adapter/**",
  "src/refcheck/adapter/**",
  "src/refcheck/usecase/**",
  "src/requirements/adapter/**",
  "src/requirements/usecase/**",
  "src/design/adapter/**",
  "src/design/usecase/**",
  "src/doctor/adapter/**",
  "src/doctor/usecase/**",
]
